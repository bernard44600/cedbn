name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Alléger l'artefact
        run: rm -rf .git
      - name: Générer la liste des fiches (drawio/index.json)
        run: |
          python3 - <<'PY'
          import json, glob, os
          fiches = sorted(os.path.basename(x)[:-7] for x in glob.glob('drawio/*.drawio'))
          json.dump(fiches, open('drawio/index.json','w',encoding='utf-8'), ensure_ascii=False, indent=1)
          print(len(fiches), "fiches listées")
          PY
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
